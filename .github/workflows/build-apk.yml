name: Build APK

on:
  push:
    branches: [master, main]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: runtime/package-lock.json

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android Platforms & Build Tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Restore debug keystore (optional)
        if: env.DEBUG_KEYSTORE_B64 != ''
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore

      - name: Package aarch64 Termux rootfs
        run: python3 scripts/package-rootfs.py

      - name: Install runtime dependencies
        working-directory: runtime
        run: npm ci --omit=dev --omit=optional --ignore-scripts

      - name: Build installable debug APK
        working-directory: android
        run: bash ./gradlew --no-daemon assembleDebug

      - name: Upload APK and package manifest
        uses: actions/upload-artifact@v4
        with:
          name: pi-termux-mobile-debug-aarch64
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/src/main/assets/termux-packages.json
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release (tags only)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/src/main/assets/termux-packages.json
